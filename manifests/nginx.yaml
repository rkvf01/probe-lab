apiVersion: apps/v1
kind: Deployment
metadata: 
  name: nginx-deployment
  labels: 
    app: nginx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx
          ports:
            - name : nginx
              containerPort: 80
---
apiVersion: v1
kind: Service
metadata: 
  name : nginx
spec:
  type: ClusterIP
  selector:
    app: nginx
  ports:
    - name: nginx
      port: 80
      targetPort: nginx



